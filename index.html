<script type="module">
/* Lecture du tableau des scores par Gemini (Firebase AI Logic, API Gemini Developer) */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
import { getAI, getGenerativeModel, GoogleAIBackend } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-ai.js';
if (window.FIREBASE_CONFIG) {
  const ai = getAI(initializeApp(window.FIREBASE_CONFIG, 'ai'), { backend: new GoogleAIBackend() });
  // Offre gratuite Gemini : quota journalier PAR modèle (20/jour pour Flash). On passe au modèle suivant quand l'un est épuisé.
  const MODELS = ['gemini-3.5-flash', 'gemini-3.5-flash-lite'];
  const cfg = { responseMimeType: 'application/json', temperature: 0 };
  const exhausted = new Set();
  const isQuota = e => /429|quota|exhaust|RESOURCE/i.test(String(e && e.message));
  window.readScoreboard = async (data, mimeType, prompt) => {
    let last;
    for (const name of MODELS) {
      if (exhausted.has(name)) continue;
      try {
        const r = await getGenerativeModel(ai, { model: name, generationConfig: cfg }).generateContent([prompt, { inlineData: { data, mimeType } }]);
        return JSON.parse(r.response.text().replace(/^\s*```(?:json)?|```\s*$/g, '').trim());
      } catch (e) {
        last = e;
        if (!isQuota(e)) throw e;
        if (/per day|daily/i.test(String(e.message))) exhausted.add(name);   // quota du jour : inutile de réessayer ce modèle
      }
    }
    throw last || new Error('quota');
  };
}
</script>

<style>
/* Layout: HUD sombre façon menu CoD — barre d'onglets collante, une colonne sur mobile, grilles de classements sur desktop. Thème unique sombre (DA de Jérémy). */
:root{
  --bg:#0c0f13; --panel:#141920; --panel2:#1b222b; --line:#27303b;
  --fg:#e7ebef; --muted:#8a96a3; --dim:#5b6673;
  --red:#e5322d; --red-soft:rgba(229,50,45,.14);
  --t1:#4ea1ff; --t1-soft:rgba(78,161,255,.14);
  --t2:#ff6a4d; --t2-soft:rgba(255,106,77,.14);
  --gold:#f2b632; --green:#3ccf7a;
  --f-display:"Teko","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;
  background-image:radial-gradient(1200px 400px at 50% -200px,rgba(229,50,45,.12),transparent 70%);background-repeat:no-repeat}
.wrap{max-width:1040px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.8;letter-spacing:.02em;text-transform:uppercase;margin:0}
.brand b{color:var(--red);font-weight:700}
.brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--muted);margin-top:8px}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.live i{background:var(--green);box-shadow:0 0 8px var(--green)}
.sync.local i{background:var(--gold)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  background:rgba(12,15,19,.92);backdrop-filter:blur(6px);padding-block:8px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;padding:6px 14px 2px;border-radius:6px;line-height:1.1}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--red);color:#fff}

main{padding-block:18px}
h2.sec{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:26px 0 10px;line-height:1;display:flex;align-items:baseline;gap:10px}
h2.sec:first-child{margin-top:4px}
h2.sec span{font-family:var(--f-body);font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
select:focus,input:focus{border-color:var(--red);outline:none}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 14px;min-height:44px;font-weight:700;letter-spacing:.04em}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:10px 18px 6px}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--t2);border-color:rgba(255,106,77,.4)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn.block{width:100%}

.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:8px;min-height:44px;font-weight:700}
.seg button.on1{background:var(--t1-soft);border-color:var(--t1);color:var(--t1)}
.seg button.on2{background:var(--t2-soft);border-color:var(--t2);color:var(--t2)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 12px;min-height:38px;font-weight:600}
.chip.t1{border-color:var(--t1);background:var(--t1-soft);color:var(--t1)}
.chip.t2{border-color:var(--t2);background:var(--t2-soft);color:var(--t2)}
.chip.on{border-color:var(--gold);background:rgba(242,182,50,.12);color:var(--gold)}
.chip em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;opacity:.9}

.balance{font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;background:var(--panel2);border:1px dashed var(--line)}
.balance .t1{color:var(--t1)} .balance .t2{color:var(--t2)}

.prow{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px}
.prow.t1{border-left-color:var(--t1)} .prow.t2{border-left-color:var(--t2)}
.prow.me{box-shadow:0 0 0 1px var(--gold) inset}
.prow-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.pname{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.tag.t1{color:var(--t1);background:var(--t1-soft)} .tag.t2{color:var(--t2);background:var(--t2-soft)}
.tag.me{color:var(--gold);background:rgba(242,182,50,.12)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step{background:var(--panel2);border-radius:8px;padding:6px;display:grid;gap:4px;min-width:0}
.step .k{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.step .ctl{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center}
.step button{height:36px;border:0;border-radius:6px;background:var(--line);font-size:20px;font-weight:700;line-height:1}
.step button:active{background:var(--red)}
.step .v{text-align:center;font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1;padding-top:3px}
.step input{min-height:36px;padding:4px 2px;text-align:center;font-family:var(--f-display);font-size:22px;border-radius:6px;background:transparent;border-color:transparent;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media (max-width:520px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}

.hero{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.award{position:relative;overflow:hidden;border-radius:12px;padding:16px 18px;border:1px solid var(--line);background:var(--panel)}
.award.gold{border-color:rgba(242,182,50,.5);background:linear-gradient(135deg,rgba(242,182,50,.16),var(--panel) 60%)}
.award .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.award.gold .k{color:var(--gold)}
.award .who{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1;margin-top:6px}
.award .sub{font-size:13px;color:var(--muted)}
.award .big{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:46px}

.quad{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.slot .k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.slot .who{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.05;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sub{font-size:12px;color:var(--muted)}

.rank{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.rank h3{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.rank ol{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .pos{color:var(--dim);font-weight:700;font-size:13px}
.rank li:first-child .pos{color:var(--gold)}
.rank .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rank .val{font-weight:700;font-variant-numeric:tabular-nums}
.rank .val small{color:var(--muted);font-weight:500;margin-left:4px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}

.stats{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.stat{background:var(--panel2);border-radius:8px;padding:10px 12px}
.stat .k{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1;margin-top:4px}
.stat .v small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.v.green{color:var(--green)} .v.red{color:var(--t2)} .v.gold{color:var(--gold)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
.scroll{overflow-x:auto}

.round{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.round-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.round-title{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1}
.round-title span{color:var(--red)}
.win{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.win.t1{color:var(--t1)} .win.t2{color:var(--t2)}
.teams{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.team{border-radius:8px;padding:8px 10px;background:var(--panel2);border-top:3px solid var(--line)}
.team.t1{border-top-color:var(--t1)} .team.t2{border-top-color:var(--t2)}

.draw-teams{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.draw-team{border-radius:10px;padding:14px;border:1px solid var(--line);background:var(--panel)}
.draw-team.t1{border-color:var(--t1);background:linear-gradient(180deg,var(--t1-soft),var(--panel) 70%)}
.draw-team.t2{border-color:var(--t2);background:linear-gradient(180deg,var(--t2-soft),var(--panel) 70%)}
.draw-team h3{margin:0 0 6px;font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.draw-team.t1 h3{color:var(--t1)} .draw-team.t2 h3{color:var(--t2)}
.draw-team ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-weight:600;font-size:17px}
.bigmap{font-family:var(--f-display);font-size:54px;font-weight:700;line-height:.9;letter-spacing:.03em;text-transform:uppercase;color:var(--gold)}

.notice{border:1px solid rgba(242,182,50,.4);background:rgba(242,182,50,.08);color:var(--fg);border-radius:10px;padding:10px 14px;font-size:13px}
.err{color:var(--t2);font-size:13px;font-weight:600}
.emptystate{text-align:center;padding:36px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.emptystate b{display:block;font-family:var(--f-display);font-size:30px;color:var(--fg);font-weight:600;letter-spacing:.03em;text-transform:uppercase}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:700;
  padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center;z-index:20}
.emoji-pal{display:flex;flex-wrap:wrap;gap:4px}
.emoji-pal button{width:38px;height:38px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;font-size:20px}
.emoji-pal button.on{border-color:var(--gold)}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
html,body{margin:0}
.plink{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.plink:hover{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.av{width:24px;height:24px;object-fit:contain;border-radius:6px;flex:none}
.plink.big .av{width:40px;height:40px}
.pop{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:16px;background:rgba(5,7,9,.82)}
.pop-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px;justify-items:center;text-align:center;width:min(100%,360px)}
.pop-card{overflow:hidden}
.pop-stage{position:relative;width:min(70vw,250px,40vh);height:min(70vw,250px,40vh);display:grid;place-items:center}
.pop-card{max-height:calc(100% - 8px);overflow:auto}
.pop-rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(229,50,45,.28) 0 10deg,transparent 10deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 62%);mask:radial-gradient(circle,#000 25%,transparent 62%)}
.pop-stk{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.pop-emoji{font-size:min(36vw,140px);line-height:1;display:grid;place-items:center}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:popfade .2s ease-out both}
  .pop-card{animation:popcard .35s cubic-bezier(.2,1.3,.4,1) both}
  .pop-rays{animation:rays 9s linear infinite}
  .pop-stk{animation:rise .75s .08s cubic-bezier(.18,1.5,.4,1) both, wobble 2.4s 1s ease-in-out infinite}
  .pop-name{animation:slam .45s .45s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes popfade{from{opacity:0}to{opacity:1}}
  @keyframes popcard{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  @keyframes rays{to{transform:rotate(360deg)}}
  @keyframes rise{0%{transform:translateY(140%) scale(.4) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:none}}
  @keyframes wobble{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-4deg) scale(1.03)}75%{transform:rotate(4deg) scale(1.03)}}
  @keyframes slam{from{transform:scale(2.2);opacity:0;letter-spacing:.3em}to{transform:none;opacity:1}}
}
/* iPhone (écran d'accueil, barre d'état translucide) : bande opaque sous l'heure/batterie pour que le contenu ne passe pas dessous */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30;pointer-events:none}
.savebar{position:sticky;bottom:0;z-index:4;margin-top:16px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 18%)}
.blocker{border:1px solid var(--t2);background:var(--t2-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:22;max-width:calc(100% - 32px);
  border:0;border-radius:999px;background:var(--gold);color:#111;font-weight:800;padding:12px 18px;box-shadow:0 8px 30px rgba(0,0,0,.5);cursor:pointer}
.picker{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.pick{display:grid;justify-items:center;gap:2px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;min-width:0}
.pick img{width:44px;height:44px;object-fit:contain}
.pick-emo{font-size:32px;line-height:44px;height:44px}
.pick-n{font-size:11px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.pick.on{border-color:var(--red);background:var(--red-soft);box-shadow:0 0 0 1px var(--red) inset}
.pick.on .pick-n{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.pick{transition:transform .15s}.pick.on{transform:scale(1.06)}.pick:active{transform:scale(.94)}}
.rules ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px;font-size:14px}

<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand"><b>LAN</b> CoD<small>Search &amp; Destroy · stats de la bande</small></h1>
    <div class="top-right"><button id="sound" class="sound" type="button">🔇 Son coupé</button><span id="sync" class="sync"><i></i><span>Connexion…</span></span></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="victory" class="victory" hidden></div>
<div id="pop" class="pop" hidden></div>
<button id="update" class="update" type="button" hidden>🔄 Nouvelle version de l’appli · toucher pour mettre à jour</button>

<script>
/* ---------- Config par défaut (doc de Jérémy) ---------- */
const DEFAULT_PLAYERS = ['Jems','Warzoute','Luis91540','ZZ','Medos','LaKrotte','Miki','Guillaume','Brillcz','Dos'];
// Pseudos en jeu connus (servent à reconnaître les joueurs sur les photos ; complétés automatiquement ensuite)
const DEFAULT_ALIASES = {LaKrotte: ['LKTR', 'LK'], Warzoute: ['Theo Tete', 'Theo', 'Théo'], ZZ: ['Zizou', 'Japan'], Brillcz: ['Brice'], Guillaume: ['Gui'], Jems: ['Jeremy', 'Jérémy'], Medos: ['medoslocos', 'Mehdi']};
const DEFAULT_MAPS = ['Highrise','Skidrow','Terminal','Scrapyard','Karachi','Favela'];
const EMOJIS = ['🎮','👑','👨‍🦲','💀','🔥','🐐','🤡','🐀','🦍','🐍','🥷','🧀','🍔','🍺','💣','🎯','🧠','🐢','🚽','💩','🦖'];
const DEFAULT_EMOJIS = {LaKrotte: '💩'};
const STATS = [
  {f:'kills', label:'Kills'},
  {f:'poses', label:'Poses'},
  {f:'desam', label:'Désam.'},
  {f:'points', label:'Points', step:50},
];
const TABS = [
  ['saisie','Saisie'],['classement','Classement'],['joueur','Joueur'],['map','Maps'],
  ['manches','Games'],['tirage','Tirage'],['votes','Votes'],['reglages','Réglages']
];

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => (String(s).replace(/[^A-Za-z0-9_\-~:@+]/g, '_').slice(0, 100)) || '_';
const fr1 = n => (Math.round(n * 10) / 10).toLocaleString('fr-FR', {maximumFractionDigits: 1});
const pct = n => Math.round(n * 100) + ' %';
const zero = name => ({name, kills:0, poses:0, desam:0, points:0});
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600);
}

/* ---------- Stockage : base partagée (Artifact) ou local (fichier ouvert seul) ---------- */
function localStore() {
  const KEY = 'codlan.db.v1';
  let data = {}; try { data = JSON.parse(lsGet(KEY) || '{}') || {}; } catch (e) {}
  const subs = new Set();
  const save = () => lsSet(KEY, JSON.stringify(data));
  const fire = () => subs.forEach(f => f());
  const snap = p => ({id: p.split('/').pop(), exists: p in data, data: () => data[p]});
  const doc = p => ({
    id: p.split('/').pop(), path: p,
    get: async () => snap(p),
    set: async d => { data[p] = JSON.parse(JSON.stringify(d)); save(); fire(); },
    update: async d => { data[p] = {...(data[p] || {}), ...d}; save(); fire(); },
    delete: async () => { delete data[p]; save(); fire(); },
    onSnapshot(next) { const f = () => next(snap(p)); subs.add(f); setTimeout(f); return () => subs.delete(f); }
  });
  const collection = c => ({
    path: c,
    doc: id => doc(c + '/' + (id || Math.random().toString(36).slice(2))),
    onSnapshot(next) {
      const depth = c.split('/').length + 1;
      const f = () => { const docs = Object.keys(data).filter(k => k.startsWith(c + '/') && k.split('/').length === depth).sort().map(snap); next({docs, size: docs.length, empty: !docs.length}); };
      subs.add(f); setTimeout(f); return () => subs.delete(f);
    }
  });
  return {doc, collection};
}

let store = null, mode = 'pending', readOnly = false;
const chains = {};
function write(path, fn) {
  if (!store) { toast('Connexion en cours, réessaie dans 2 s'); return Promise.resolve(); }
  if (readOnly) { toast('Lecture seule : demande un accès Contributeur à Medos'); return Promise.resolve(); }
  chains[path] = (chains[path] || Promise.resolve()).then(() => fn(store.doc(path))).catch(e => {
    if (e && e.code === 'invalid_argument') { readOnly = true; toast('Tu es en lecture seule sur cette appli'); render(); }
    else if (e && e.code === 'quota_exceeded') toast('Base pleine : supprime des vieilles games');
    else if (e && e.code === 'permission-denied') toast('La base refuse l’écriture : préviens Medos');
    else toast('Échec de l’enregistrement, réessaie');
  });
  return chains[path];
}

/* ---------- État ---------- */
const S = {
  roster: {players: DEFAULT_PLAYERS.map(name => ({name, emoji: DEFAULT_EMOJIS[name] || '🎮', aliases: [...(DEFAULT_ALIASES[name] || [])]})), maps: [...DEFAULT_MAPS]},
  current: {map: DEFAULT_MAPS[0], winner: 0, lineup: []},
  liverows: {}, rounds: [], draw: null, loaded: {rounds:false}
};
const U = {
  tab: (location.hash || '').slice(1) || lsGet('codlan.tab') || 'saisie',
  me: lsGet('codlan.me') || '',
  selPlayer: '', selMap: '',
  confirm: null,          // clé de l'action à confirmer
  edit: null,             // copie d'une game en cours de modification
  drawSel: null, drawBal: true, drawOdd: 'bot',
  newEmoji: '🎮',
  snd: {file: null, start: 0, dur: 12, busy: false}
};
if (!TABS.some(t => t[0] === U.tab)) U.tab = 'saisie';

const pending = {}; const timers = {};
const rowOf = name => pending[name] || S.liverows[name] || zero(name);
const emojiOf = name => (S.roster.players.find(p => p.name === name) || {}).emoji || '🎮';
const label = name => `${emojiOf(name)} ${esc(name)}`;
const playerNames = () => S.roster.players.map(p => p.name);

/* ---------- Stickers des joueurs (config/sticker_<joueur>) ---------- */
const stickers = {};            // nom -> URL blob locale
const stickerKey = {};          // nom -> version, pour ne recréer l'URL que si l'image change
const avatar = (name, cls = 'av') => stickers[name] ? `<img class="${cls}" src="${stickers[name]}" alt="">` : '';
// Nom cliquable : ouvre la fiche rapide du joueur avec son sticker
const plink = (name, big) => `<button type="button" class="plink${big ? ' big' : ''}" data-a="pl" data-k="${esc(name)}">${stickers[name] ? avatar(name) + ' ' + esc(name) : label(name)}</button>`;
function dataUrlToBlobUrl(dataUrl) {
  const [head, b64] = dataUrl.split(','), mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/png';
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([u], {type: mime}));
}
function stickerFromFile(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 360 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let out = c.toDataURL('image/webp', 0.85);                    // garde la transparence des stickers
      if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
      if (out.length > 600000) out = c.toDataURL('image/jpeg', 0.8);
      res(out);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image illisible')); };
    im.src = url;
  });
}
function showPlayer(name) {
  const {list} = compute(S.rounds), s = list.find(x => x.name === name);
  const p = S.roster.players.find(x => x.name === name) || {};
  const pop = $('#pop');
  pop.innerHTML = `<div class="pop-card" role="dialog" aria-label="${esc(name)}">
    <div class="pop-stage"><div class="pop-rays" aria-hidden="true"></div>
      ${stickers[name] ? `<img class="pop-stk" src="${stickers[name]}" alt="Sticker de ${esc(name)}">` : `<div class="pop-stk pop-emoji">${esc(emojiOf(name))}</div>`}</div>
    <div class="pop-name">${esc(name)}</div>
    ${p.aliases && p.aliases.length ? `<div class="muted" style="font-size:12px">En jeu : ${esc(p.aliases.join(', '))}</div>` : ''}
    <div class="pop-stats num">${s ? `${s.m} game${s.m > 1 ? 's' : ''} · ${fr1(s.avg_points)} pts/game · ${s.w} V – ${s.l} D` : 'Pas encore joué'}</div>
    <div class="row" style="justify-content:center"><button class="btn primary" data-a="pl-open" data-k="${esc(name)}">Voir sa fiche</button><button class="btn ghost" data-a="pl-close">Fermer</button></div>
  </div>`;
  pop.hidden = false;
  playSnippet(4);
}
function closePop() { $('#pop').hidden = true; stopVictory(); }

function setRow(name, row) {
  pending[name] = row; render();
  clearTimeout(timers[name]);
  timers[name] = setTimeout(() => flushRow(name), 350);
}
function flushRow(name) {
  const row = pending[name]; if (!row) return Promise.resolve();
  clearTimeout(timers[name]);
  return write('liverows/' + slug(name), d => d.set(row)).then(() => { if (pending[name] === row) delete pending[name]; });
}
function setCurrent(patch) {
  S.current = {...S.current, ...patch}; render();
  const snapshot = {...S.current};
  return write('live/current', d => d.set(snapshot));
}

/* ---------- Calculs ---------- */
function teamSizes(r) { const s = {1: 0, 2: 0}; r.players.forEach(p => s[p.team]++); const b = r.bots || {}; s[1] += +b[1] || 0; s[2] += +b[2] || 0; return s; }
function compute(rounds) {
  const P = {}, duos = {};
  const get = n => P[n] || (P[n] = {name:n, m:0, w:0, l:0, kills:0, poses:0, desam:0, points:0, sup:0, inf:0, eq:0, partners:{}, maps:{}});
  for (const r of rounds) {
    const size = teamSizes(r);
    for (const team of [1, 2]) {
      const names = r.players.filter(p => p.team === team).map(p => p.name);
      const won = r.winner === team;
      for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) {
        const pair = [names[i], names[j]].sort(); const k = pair.join('|');
        const d = duos[k] || (duos[k] = {a: pair[0], b: pair[1], w:0, l:0});
        won ? d.w++ : d.l++;
      }
    }
    // « Premiers » de la game : meilleur score (MVP), meilleur de son équipe, plus de kills (égalités comptées pour chacun)
    const topPts = Math.max(...r.players.map(p => +p.points || 0)), topK = Math.max(...r.players.map(p => +p.kills || 0));
    const teamTop = {1: 0, 2: 0}; r.players.forEach(p => { teamTop[p.team] = Math.max(teamTop[p.team], +p.points || 0); });
    const sc = r.score, wsc = sc ? +sc[r.winner] : NaN, lsc = sc ? +sc[3 - r.winner] : NaN;
    const shutout = sc && lsc === 0 && wsc >= 6;                    // 6-0 (ou plus) : fessée
    for (const p of r.players) {
      const s = get(p.name), won = p.team === r.winner;
      s.m++; won ? s.w++ : s.l++;
      if (r.players.length && (+p.points || 0) === topPts) s.mvp = (s.mvp || 0) + 1;
      if ((+p.points || 0) === teamTop[p.team]) s.teamTop = (s.teamTop || 0) + 1;
      if (r.players.length && (+p.kills || 0) === topK) s.topKill = (s.topKill || 0) + 1;
      if (sc) s.scored = (s.scored || 0) + 1;
      if (shutout) won ? s.shutWon = (s.shutWon || 0) + 1 : s.shutLost = (s.shutLost || 0) + 1;
      STATS.forEach(({f}) => s[f] += (+p[f] || 0));
      const mine = size[p.team], theirs = size[3 - p.team];
      mine > theirs ? s.sup++ : mine < theirs ? s.inf++ : s.eq++;
      if (won && mine < theirs) s.wInf = (s.wInf || 0) + 1;      // gagner en sous-nombre vaut plus

/* Participation visible partout : barre rouge = part des games jouées + « x/N g. » à côté de la valeur.
   RANK_N = nombre de games du périmètre affiché (toutes, ou celles de la map). */
let RANK_N = 0, RANK_MIN = 0;
function rankCard(title, list, key, fmt, opts = {}) {
  const items = rankBy(list.filter(s => (opts.all || s.m > 0) && (opts.keepZero || s[key] > 0)), key).slice(0, opts.limit || 10);
  const row = (s, i) => {
    const part = RANK_N ? Math.round(100 * s.m / RANK_N) : 0, low = RANK_N && RANK_MIN && s.m < RANK_MIN;
    return `<li class="${low ? 'low' : ''}" style="--part:${part}%" title="${s.m}/${RANK_N} games jouées"><span class="pos">${i + 1}</span><span class="n">${plink(s.name)}</span><span class="val">${fmt(s)}${RANK_N ? `<small class="gp">${s.m}/${RANK_N} g.</small>` : ''}</span></li>`;
  };
  return `<div class="rank"><h3>${title}</h3>${items.length ? `<ol>${items.map(row).join('')}</ol>` : '<div class="empty">Aucune donnée</div>'}</div>`;
}
function noRounds(what) {
  return `<div class="emptystate"><b>Aucune game</b>${what} apparaîtront dès la première game validée dans l’onglet Saisie.</div>`;
}

function quatuor(list) {
  const played = list.filter(s => s.ok), taken = new Set(), out = [];
  for (const {f, label: l} of STATS) {
    const best = rankBy(played, 'adj_' + f).find(s => !taken.has(s.name) && s['avg_' + f] > 0);
    if (!best) { out.push({role: 'Top ' + l, s: null, v: 'Personne pour l’instant'}); continue; }
    { taken.add(best.name); out.push({role: 'Top ' + l, s: best, v: fr1(best['avg_' + f]) + ' / game'}); }
  }
  return out;
}

/* ---------- Classement général (indice équitable /100) ----------
   Chaque stat est prise PAR GAME et ajustée (3 games « fantômes » à la moyenne du groupe),
   donc jouer plus ne gonfle pas le score. Pondération : points 35 %, kills 25 %, victoires 25 %, objectif 15 %.
   Points / kills / objectif sont comparés au meilleur du groupe ; victoires = % ajusté (gagner en sous-nombre compte plus). */
const IDX_W = {p: 0.35, k: 0.25, w: 0.25, o: 0.15};
function globalIndex(list) {
  const pl = list.filter(s => s.m > 0);
  pl.forEach(s => { s.adj_obj = s.adj_poses + s.adj_desam; s.avg_obj = s.avg_poses + s.avg_desam; });
  const best = k => Math.max(1e-9, ...pl.map(s => s[k]));
  const bp = best('adj_points'), bk = best('adj_kills'), bo = best('adj_obj');
  pl.forEach(s => {
    s.c = {p: s.adj_points / bp, k: s.adj_kills / bk, w: s.wr_fair, o: s.adj_obj / bo};
    s.idx = 100 * (IDX_W.p * s.c.p + IDX_W.k * s.c.k + IDX_W.w * s.c.w + IDX_W.o * s.c.o);
  });
  return pl;
}
function vClassement() {
  return U.rankDetail
    ? `<button class="btn ghost" data-a="rank-general" style="margin-top:4px">← Classement général</button>` + vClassementDetail()
    : vGeneral();
}
function vGeneral() {
  const {list, minGames} = compute(S.rounds), N = S.rounds.length;
  const pl = globalIndex(list);
  const ok = pl.filter(s => s.ok).sort((a, b) => b.idx - a.idx || b.m - a.m);
  const prov = pl.filter(s => !s.ok).sort((a, b) => b.idx - a.idx);
  const absent = playerNames().filter(n => !pl.some(s => s.name === n));
  const medal = i => ['🥇', '🥈', '🥉'][i] || '';
  const face = n => `<button type="button" class="gface" data-a="pl" data-k="${esc(n)}" aria-label="Fiche de ${esc(n)}">${stickers[n] ? `<img src="${stickers[n]}" alt="">` : `<span>${esc(emojiOf(n))}</span>`}</button>`;
  const row = (s, i, provisional) => {
    const last = !provisional && ok.length >= 3 && i === ok.length - 1;
    const part = N ? Math.round(100 * s.m / N) : 0;
    return `<li class="gen-row${provisional ? ' prov' : ''}${!provisional && i < 3 ? ' top' + (i + 1) : ''}">
      <span class="gpos num">${provisional ? '⏳' : i + 1}</span>
      ${face(s.name)}
      <div class="gmid"><div class="gname"><button type="button" class="plink" data-a="pl" data-k="${esc(s.name)}">${esc(s.name)}</button> ${provisional ? '' : medal(i)}${last ? ' 👨‍🦲' : ''}</div>
        <div class="gbar" style="--part:${part}%" title="${s.m}/${N} games jouées"></div>
        <div class="gsub num">${Math.round(s.avg_points)} pts/g · ${fr1(s.avg_kills)} K/g · ${pct(s.wr)} vic · ${fr1(s.avg_obj)} obj/g · <b>${s.m}/${N} g.</b></div></div>
      <div class="gscore num">${Math.round(s.idx)}<small>/100</small></div></li>`;
  };
  return `<h2 class="sec">Classement général <span>équitable · ${N} game${N > 1 ? 's' : ''}</span></h2>
  ${N ? `<ol class="gen">${ok.map((s, i) => row(s, i, false)).join('')}</ol>
  ${prov.length ? `<div class="gen-label">⏳ Provisoire · moins de ${minGames} game${minGames > 1 ? 's' : ''} jouée${minGames > 1 ? 's' : ''}</div><ol class="gen">${prov.map((s, i) => row(s, i, true)).join('')}</ol>` : ''}`
    : `<div class="notice">Aucune game pour l’instant : le classement se remplira dès la première photo validée.</div>`}
  ${absent.length ? `<div class="gen-label">Pas encore joué</div><div class="chips">${absent.map(n => `<span class="chip">${plink(n)}</span>`).join('')}</div>` : ''}
  <details class="how"><summary>Comment le score est calculé ?</summary>
    <p>Un score sur 100 qui ne dépend pas du nombre de games jouées : tout est calculé <b>par game</b>.</p>
    <ul><li><b>Points</b> par game : 35 %</li><li><b>Kills</b> par game : 25 %</li><li><b>% de victoires</b> : 25 % (gagner en sous-nombre compte plus, perdre en surnombre coûte plus)</li><li><b>Objectif</b> (poses + désamorçages) par game : 15 %</li></ul>
    <p>Points, kills et objectif sont comparés au meilleur du groupe. Chacun part avec ${FAIR_K} games « fantômes » à la moyenne du groupe : 2 grosses games ne suffisent pas pour passer n°1, il faut confirmer. Moins de ${minGames} game${minGames > 1 ? 's' : ''} jouée${minGames > 1 ? 's' : ''} (30 %) = classement provisoire.</p>
    <p>La barre rouge montre la part des games jouées.</p>
  </details>
  <button class="btn primary block" data-a="rank-detail" style="margin-top:14px">📊 Voir tous les classements détaillés</button>`;
}

  <div class="grid g4">${rankCard('Victoires', list, 'w', s => s.w, all)}${rankCard('Défaites', list, 'l', s => s.l, all)}</div>`;

  const worstDuo = [...duos].filter(d => d.l > 0).sort((a, b) => b.l - a.l || a.w - b.w).slice(0, 3);
  const duoList = (arr, k) => arr.length ? `<ol>${arr.map((d, i) => `<li><span class="pos">${i + 1}</span><span class="n">${plink(d.a)} &amp; ${plink(d.b)}</span><span class="val">${d[k]}<small>${k === 'w' ? 'V' : 'D'}</small></span></li>`).join('')}</ol>` : '<div class="empty">Pas encore de duo</div>';
  const avg = (f) => s => fr1(s['avg_' + f]);
  return `${squad}
  <div class="legend"><span class="legend-bar"></span><span><b>Barre rouge = part des games jouées</b> (ex. <b>3/${RANK_N} g.</b>). Les <b>totaux</b> avantagent ceux qui jouent le plus ; les joueurs <span style="opacity:.55">grisés</span> ont joué moins de ${minGames} game${minGames > 1 ? 's' : ''}. Pour comparer à égalité, regarde les <b>moyennes</b>.</span></div>
  <h2 class="sec">Stats totales <span>avantage à ceux qui jouent le plus</span></h2>
  <div class="grid g4">${STATS.map(s => rankCard(s.label, list, s.f, x => x[s.f], all)).join('')}</div>
  <div class="notice" style="margin-top:6px"><b>Classement équitable.</b> Tout le monde ne joue pas toutes les games : les moyennes sont ajustées (chaque joueur part avec ${FAIR_K} games « fantômes » à la moyenne du groupe, donc 2 bonnes games ne suffisent pas à être n°1). Top, Pire, Quatuor et moyennes : minimum ${minGames} game${minGames > 1 ? 's' : ''} jouée${minGames > 1 ? 's' : ''} (30 % des games).</div>
  <h2 class="sec">Stats moyennes <span>par game jouée</span></h2>
  <div class="grid g4">${STATS.map(s => rankCard('Moy. ' + s.label, fair, 'adj_' + s.f, avg(s.f))).join('')}</div>
  <h2 class="sec">Victoires / Défaites</h2>

function playerSelect(id, value, list) {
  return `<select id="${id}" data-a="${id}">${list.map(n => `<option ${n === value ? 'selected' : ''} value="${esc(n)}">${label(n)}</option>`).join('')}</select>`;
}

function vJoueur() {
  const names = [...new Set([...playerNames(), ...S.rounds.flatMap(r => r.players.map(p => p.name))])]
    .sort((a, b) => a.localeCompare(b, 'fr', {sensitivity: 'base'}));
  if (!U.selPlayer || !names.includes(U.selPlayer)) U.selPlayer = names.includes(U.me) ? U.me : names[0];
  const {list} = compute(S.rounds);
  const s = list.find(x => x.name === U.selPlayer);
  // Sélecteur en grille de stickers (une liste déroulante ne peut pas afficher d'images), ordre alphabétique
  const head = `<div class="picker" role="listbox" aria-label="Choisir un joueur">${names.map(n => `<button type="button" role="option" aria-selected="${n === U.selPlayer}" class="pick${n === U.selPlayer ? ' on' : ''}" data-a="pick-player" data-k="${esc(n)}">${stickers[n] ? `<img src="${stickers[n]}" alt="">` : `<span class="pick-emo">${esc(emojiOf(n))}</span>`}<span class="pick-n">${esc(n)}</span></button>`).join('')}</div>
  <h2 class="sec" style="margin-top:18px">${esc(U.selPlayer)} <span>touche son sticker pour la fiche animée</span></h2>`;
  if (!s) return head + `<div class="emptystate" style="margin-top:12px"><b>Pas encore joué</b>${esc(U.selPlayer)} n’apparaît dans aucune game validée.</div>`;
  const partners = Object.entries(s.partners).map(([name, v]) => ({name, n: v.n, w: v.w})).sort((a, b) => b.n - a.n || b.w - a.w);
  const maps = Object.entries(s.maps).map(([n, v]) => ({n, ...v, avg: v.points / v.m})).sort((a, b) => b.w - a.w || a.l - b.l);
  const byAvg = [...maps].sort((a, b) => b.avg - a.avg);
  const fav = byAvg[0], hate = byAvg.length > 1 ? byAvg[byAvg.length - 1] : null;
  return head + `

function vMap() {
  const maps = [...new Set([...S.roster.maps, ...S.rounds.map(r => r.map)])];
  if (!U.selMap || !maps.includes(U.selMap)) U.selMap = maps[0];
  const rs = S.rounds.filter(r => r.map === U.selMap);
  RANK_N = rs.length; RANK_MIN = 0;
  const {list} = compute(rs);
  const counts = maps.map(m => ({m, n: S.rounds.filter(r => r.map === m).length})).sort((a, b) => b.n - a.n);
  // Les équipes changent à chaque game : on raisonne par joueur. Une composition n'est affichée que si elle revient.
  const comps = {};
  rs.forEach(r => [1, 2].forEach(t => {
    const names = r.players.filter(p => p.team === t).map(p => p.name).sort();
    if (names.length < 2) return;
    const key = names.join('|'), c = comps[key] || (comps[key] = {names, n: 0, w: 0});
    c.n++; if (r.winner === t) c.w++;
  }));
  const recurring = Object.values(comps).filter(c => c.n >= 2).sort((a, b) => b.n - a.n || b.w - a.w);
  return `<div class="panel"><label class="lbl" for="sel-map">Map</label><select id="sel-map" data-a="sel-map">${maps.map(m => `<option ${m === U.selMap ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
  <h2 class="sec">Stats <span>${esc(U.selMap)}</span></h2>
  <div class="stats">
    <div class="stat"><div class="k">Fois jouée</div><div class="v num">${rs.length}</div></div>
    <div class="stat"><div class="k">Joueurs passés dessus</div><div class="v num">${list.length}</div></div>
  </div>
  ${rs.length ? `<h2 class="sec">Victoires par joueur <span>sur cette map</span></h2>
  <div class="grid g4">
    ${rankCard('% de victoires', list, 'wr', x => pct(x.wr), {keepZero: true})}
    ${rankCard('Victoires', list, 'w', x => x.w)}
  </div>
  ${recurring.length ? `<h2 class="sec">Équipes qui reviennent <span>même composition 2 fois ou plus</span></h2>
  <div class="grid">${recurring.map(c => `<div class="panel row" style="justify-content:space-between"><span>${c.names.map(label).join(' · ')}</span><b class="num">${c.w} V · ${c.n - c.w} D</b></div>`).join('')}</div>` : ''}

  <div class="grid g4">${STATS.map(s => rankCard(s.label + ' joueurs', list, 'avg_' + s.f, x => fr1(x['avg_' + s.f]))).join('')}</div>` : `<div class="emptystate" style="margin-top:12px"><b>Pas encore jouée</b>Aucune game validée sur ${esc(U.selMap)}.</div>`}
  <h2 class="sec">Maps les plus jouées</h2>
  <div class="panel"><div class="chips">${counts.map(c => `<button class="chip ${c.m === U.selMap ? 'on' : ''}" data-a="pick-map" data-k="${esc(c.m)}">${esc(c.m)} <em>${c.n}</em></button>`).join('')}</div></div>`;
}

/* ---------- Votes anonymes ----------
   Chaque téléphone a un identifiant aléatoire (jamais relié à un nom) : 1 vote par catégorie, modifiable à volonté. */
const VOTE_CATS = [
  {id: 'campeur', e: '🏕️', t: 'Le plus gros campeur', sub: 'Toujours planqué dans son coin'},
  {id: 'kar', e: '🎯', t: 'Le roi de la KAR', sub: 'Un tir, un mort'},
  {id: 'bouclier', e: '🛡️', t: 'Le roi du bouclier anti-émeute', sub: 'Le tank de la bande'},
  {id: 'cronus', e: '🕵️', t: 'Le plus suspecté d’avoir un Cronus', sub: 'Trop fort pour être honnête'},
];
const voterId = (() => {
  let v = lsGet('codlan.voter');
  if (!v) { v = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join(''); lsSet('codlan.voter', v); }
  return v;
})();
const voteDocId = (cat, voter) => `live/vote_${cat}_${voter}`;
function castVote(cat, name) {
  const mine = ((S.votes || {})[cat] || {})[voterId];
  const votes = S.votes || (S.votes = {});
  const m = votes[cat] || (votes[cat] = {});
  if (mine === name) {
    delete m[voterId]; render();
    write(voteDocId(cat, voterId), d => d.delete()).then(() => toast('Vote retiré'));
  } else {
    m[voterId] = name; render();
    write(voteDocId(cat, voterId), d => d.set({cat, voter: voterId, choice: name, at: Date.now()})).then(() => toast(mine ? 'Vote changé' : 'A voté ! 🗳️'));
  }
}
function vVotes() {
  const names = [...playerNames()].sort((a, b) => a.localeCompare(b, 'fr', {sensitivity: 'base'}));
  const face = (n, cls) => stickers[n] ? `<img class="${cls}" src="${stickers[n]}" alt="">` : `<span class="${cls}-emo">${esc(emojiOf(n))}</span>`;
  return `<div class="notice">🗳️ <b>Votes 100 % anonymes.</b> 1 vote par catégorie, modifiable quand tu veux. Retouche ton choix pour retirer ton vote.</div>
  ${VOTE_CATS.map(c => {
    const m = (S.votes || {})[c.id] || {}, mine = m[voterId];
    const counts = {}; Object.values(m).forEach(n => { counts[n] = (counts[n] || 0) + 1; });
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const top = ranked.length ? ranked[0][1] : 0, leaders = ranked.filter(r => r[1] === top).map(r => r[0]);
    return `<section class="vote-card">
      <div class="vote-head"><span class="vote-e">${c.e}</span><div><h3>${esc(c.t)}</h3><div class="muted" style="font-size:13px">${esc(c.sub)} · ${total} vote${total > 1 ? 's' : ''}</div></div></div>
      ${total ? `<div class="vote-lead">${leaders.map(n => `<button type="button" class="vote-lead-p" data-a="pl" data-k="${esc(n)}">${face(n, 'vl')}<b>${esc(n)}</b></button>`).join('')}<div class="vote-lead-t">${leaders.length > 1 ? 'Égalité' : 'En tête'} · ${top} vote${top > 1 ? 's' : ''}</div></div>
      <div class="vote-bars">${ranked.map(([n, k]) => `<div class="vbar"><span>${esc(n)}</span><i style="--w:${Math.round(100 * k / total)}%"></i><b class="num">${k}</b></div>`).join('')}</div>`
      : '<div class="empty">Personne n’a encore voté. Lance-toi !</div>'}
      <div class="lbl" style="margin-top:12px">${mine ? `Ton vote : ${esc(mine)} · touche un autre joueur pour changer` : 'Ton vote'}</div>
      <div class="picker">${names.map(n => `<button type="button" class="pick${mine === n ? ' on' : ''}" data-a="vote" data-k="${c.id}" data-v="${esc(n)}" aria-pressed="${mine === n}">${face(n, 'pk')}<span class="pick-n">${esc(n)}</span></button>`).join('')}</div>
    </section>`;
  }).join('')}`;
}

/* ---------- Code admin (verrouille Réglages) ---------- */
let adminHash = null, adminLoaded = false;
// Déverrouillage valable pour la session seulement : le code est redemandé à chaque réouverture de l'appli
const ssGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
const isAdmin = () => !!adminHash && ssGet('codlan.admin') === adminHash;
async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('codlan:' + s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function vLocked(title = 'Réglages verrouillés') {
  return `<h2 class="sec">${title} <span>réservé à l’admin</span></h2>
  <div class="panel grid" style="max-width:420px">
    <label class="lbl" for="adm-code">Code admin</label>
    <input id="adm-code" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••">
    <button class="btn primary" data-a="adm-unlock">Déverrouiller</button>
    ${adminLoaded ? '' : '<div class="muted" style="font-size:13px">Connexion à la base…</div>'}
  </div>`;
}

function saveRoster(roster) { S.roster = roster; render(); return write('config/roster', d => d.set(roster)); }

const DRAW_TOGETHER = [['Brillcz', 'Cronus']];
function drawTeams() {
  let names = [...U.drawSel].filter(x => playerNames().includes(x));
  if (names.length < 2) return toast('Sélectionne au moins 2 joueurs');
  names = shuffle(names);
  // Duos inséparables : toujours dans la même équipe quand les deux sont présents
  const together = DRAW_TOGETHER.filter(([x, y]) => names.includes(x) && names.includes(y));
  const valid = (a, b) => together.every(([x, y]) => a.includes(x) === a.includes(y));
  let spectator = null;
  if (U.drawOdd === 'spec' && names.length % 2) {
    const i = names.findIndex(n => !together.some(pair => pair.includes(n)));
    spectator = names.splice(i < 0 ? names.length - 1 : i, 1)[0];
  }
  const half = Math.ceil(names.length / 2);
  const botNeeded = U.drawOdd === 'bot' && names.length % 2 === 1;   // l'équipe en sous-nombre reçoit un bot
  let t1, t2;
  if (U.drawBal && S.rounds.length) {
    const {list} = compute(S.rounds);
    const known = list.filter(s => s.m > 0), base = known.length ? known.reduce((a, s) => a + s.avg_points, 0) / known.length : 0;
    const val = n => { const s = list.find(x => x.name === n); return s && s.m ? s.adj_points : base; };
    const botVal = botNeeded ? base * 0.5 : 0;
    const cands = [];
    for (let i = 0; i < 600; i++) {
      const sh = shuffle(names), a = sh.slice(0, half), b = sh.slice(half);
      if (!valid(a, b)) continue;
      cands.push({a, b, diff: Math.abs(a.reduce((x, n) => x + val(n), 0) - b.reduce((x, n) => x + val(n), 0) - botVal)});
    }
    cands.sort((x, y) => x.diff - y.diff);
    const pick = cands[Math.floor(Math.random() * Math.min(5, cands.length))] || {a: names.slice(0, half), b: names.slice(half)};
    t1 = pick.a; t2 = pick.b;
  } else {
    let sh = names;
    for (let i = 0; i < 200 && !valid(sh.slice(0, half), sh.slice(half)); i++) sh = shuffle(names);
    t1 = sh.slice(0, half); t2 = sh.slice(half);
  }
  const bot = botNeeded ? (t1.length < t2.length ? 1 : 2) : 0;
  guardedDraw(cur => {
    const keepMap = cur && cur.map && !drawConsumed(cur.mapAt || cur.at || 0);
    return {...(keepMap ? {map: cur.map, mapAt: cur.mapAt || cur.at} : {}), t1, t2, spectator, bot, at: Date.now()};
  }, teamsLockedIn, 'Les équipes sont déjà tirées');
}
function drawMap() {
  const last = [...S.rounds].sort((a, b) => b.createdAt - a.createdAt)[0];
  let pool = S.roster.maps.filter(m => !last || m !== last.map);
  if (!pool.length) pool = S.roster.maps;
  if (!pool.length) return toast('Ajoute des maps dans Réglages');
  const map = pool[Math.floor(Math.random() * pool.length)];
  guardedDraw(cur => ({...(cur && cur.t1 && !drawConsumed(cur.at || 0) ? cur : {}), map, mapAt: Date.now()}), mapLockedIn, 'La map est déjà tirée');
}
/* ---------- Règles du tirage ----------
   1 seul tirage à la fois pour tout le monde, verrouillé jusqu'à la photo de fin de game
   (une game validée après le tirage le « consomme »), visible par tous, relance réservée à l'admin. */
const drawConsumed = at => S.rounds.some(r => (r.createdAt || 0) > at);
const teamsLockedIn = d => !!(d && d.t1 && !drawConsumed(d.at || 0));
const mapLockedIn = d => !!(d && d.map && !drawConsumed(d.mapAt || d.at || 0));
async function guardedDraw(build, isLocked, lockedMsg) {
  const msg = lockedMsg + ' : verrouillé jusqu’à la photo de fin de game (l’admin peut relancer).';
  if (mode === 'firebase' && store.runTransaction) {
    try {
      const ref = store.doc('live/draw');
      const next = await store.runTransaction(async tx => {
        const snap = await tx.get(ref), cur = snap.exists ? snap.data() : null;
        if (isLocked(cur)) return null;
        const n = build(cur); tx.set(ref, n); return n;
      });
      if (!next) return toast(msg);
      S.draw = next; render();
    } catch (e) { toast('Tirage impossible, vérifie ta connexion et réessaie'); }
    return;
  }
  if (isLocked(S.draw)) return toast(msg);
  const next = build(S.draw); S.draw = next; render();
  write('live/draw', d => d.set(next));
}

async function validate() {
  const cur = S.current;
  if (!cur.lineup.length) return toast('Ajoute au moins un joueur');
  if (!cur.lineup.some(l => l.team === 1) || !cur.lineup.some(l => l.team === 2)) return toast('Il faut au moins un joueur dans chaque équipe');
  if (cur.winner !== 1 && cur.winner !== 2) return toast('Choisis l’équipe gagnante');
  const names = cur.lineup.map(l => l.name);
  await Promise.all(names.map(flushRow));
  const n = Math.max(0, ...S.rounds.map(r => r.n || 0)) + 1;
  const players = cur.lineup.map(l => { const r = rowOf(l.name); return {name: l.name, team: l.team, kills: +r.kills || 0, poses: +r.poses || 0, desam: +r.desam || 0, points: +r.points || 0}; });
  const id = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  await write('rounds/' + id, d => d.set({n, map: cur.map, winner: cur.winner, createdAt: Date.now(), players}));
  names.forEach(nm => { delete pending[nm]; delete S.liverows[nm]; write('liverows/' + slug(nm), d => d.delete()); });
  await setCurrent({winner: 0});
  toast(`Game ${n} enregistrée`);
}

    case 'stk-rm': if (isAdmin()) { delete stickers[k]; render(); write('config/sticker_' + slug(k), d => d.delete()).then(() => toast('Sticker retiré')); } break;
    case 'dr-bot': { const bt = U.draft.bots || (U.draft.bots = {1: 0, 2: 0}); bt[k] = Math.max(0, (bt[k] || 0) + (+b.dataset.d)); render(); break; }

      if (a === 'r-edit') { U.confirm = 'edit:' + k; render(); setTimeout(() => { const i = $('#edit-code'); if (i) i.focus(); }, 50); break; }

        if (h === adminHash) { ssSet('codlan.admin', h); open(); }

      });

    }

    case 'r-del-ok': {

      if (isAdmin()) { del(); break; }
      if (!adminLoaded) return toast('Connexion à la base, réessaie');
      const inp = $('#del-code');
      sha256(inp ? inp.value.trim() : '').then(h => {
        if (h === adminHash) { ssSet('codlan.admin', h); del(); }
        else { toast('Code incorrect : suppression réservée à l’admin'); if (inp) inp.value = ''; }
      });
      break;
    }
    case 'e-win': U.edit.winner = +v; render(); break;
    case 'e-team': { const p = U.edit.players[+k]; p.team = 3 - p.team; render(); break; }
    case 'e-rm': U.edit.players.splice(+k, 1); render(); break;
    case 'e-step': { const p = U.edit.players[+k], f = b.dataset.f; p[f] = Math.max(0, (+p[f] || 0) + (+b.dataset.d)); render(); break; }
    case 'e-cancel': U.edit = null; render(); break;
    case 'e-save': {
      const e2 = U.edit;
      if (!isAdmin()) { U.edit = null; render(); return toast('Modification réservée à l’admin'); }
      if (!e2.players.some(p => p.team === 1) || !e2.players.some(p => p.team === 2)) return toast('Il faut au moins un joueur dans chaque équipe');
      const {id, ...body} = e2; U.edit = null;
      if (!(body.score && Number.isInteger(body.score[1]) && Number.isInteger(body.score[2]))) delete body.score;
      S.rounds = S.rounds.map(r => r.id === id ? e2 : r); render();
      write('rounds/' + id, d => d.set(body)).then(() => toast(`Game #${e2.n} corrigée`)); break;
    }
    case 'd-sel': U.drawSel.has(k) ? U.drawSel.delete(k) : U.drawSel.add(k); render(); break;
    case 'd-bal': U.drawBal = !U.drawBal; render(); break;
    case 'd-odd': U.drawOdd = U.drawOdd === v ? 'none' : v; render(); break;
    case 'd-teams': drawTeams(); break;
    case 'd-reset': U.confirm = 'dreset'; render(); break;
    case 'd-reset-ok': {
      const reset = () => { U.confirm = null; S.draw = null; render(); write('live/draw', d => d.delete()).then(() => toast('Tirage annulé : vous pouvez relancer')); };
      if (isAdmin()) { reset(); break; }
      if (!adminLoaded) return toast('Connexion à la base, réessaie');
      const inp = $('#dreset-code');
      sha256(inp ? inp.value.trim() : '').then(h => {
        if (h === adminHash) { ssSet('codlan.admin', h); reset(); }

      });
      break;

    case 'd-map': drawMap(); break;

      U.tab = 'saisie'; render(); window.scrollTo({top: 0}); break;

    case 'adm-unlock': {
      const code = $('#adm-code').value.trim();
      if (!adminLoaded) return toast('Connexion à la base, réessaie');
      sha256(code).then(h => {
        if (h === adminHash) { ssSet('codlan.admin', h); toast('Réglages déverrouillés'); render(); }

      });
      break;
    }
    case 'adm-change': {
      if (!isAdmin()) return;
      const code = $('#adm-new').value.trim();
      if (code.length < 4) return toast('4 caractères minimum');
      sha256(code).then(h => { ssSet('codlan.admin', h); adminHash = h; write('config/admin', d => d.set({hash: h})).then(() => { toast('Code admin changé'); render(); }); });
      break;
    }
    case 'wipe': U.confirm = 'wipe'; render(); break;
    case 'wipe-ok': {
      if (!isAdmin()) return;
      U.confirm = null;
      const ids = S.rounds.map(r => r.id);
      S.rounds = []; S.draw = null; seenRounds = new Set(); render();
      Promise.all([...ids.map(id => write('rounds/' + id, d => d.delete())), write('live/draw', d => d.delete()), ...Object.entries(S.votes || {}).flatMap(([cat, m]) => Object.keys(m).map(voter => write(voteDocId(cat, voter), d => d.delete())))]).then(() => toast(`${ids.length} game${ids.length > 1 ? 's' : ''} effacée${ids.length > 1 ? 's' : ''}`));
      break;
    }
    case 'adm-lock': ssSet('codlan.admin', ''); lsSet('codlan.admin', ''); render(); toast('Réglages verrouillés sur cet appareil'); break;
    case 'set-emoji': saveRoster({...S.roster, players: S.roster.players.map(p => p.name === k ? {...p, emoji: v} : p)}); break;

    case 'set-rm-ok': U.confirm = null; saveRoster({...S.roster, players: S.roster.players.filter(p => p.name !== k)}); break;
    case 'set-add': {
      const inp = $('#new-player'); const name = inp.value.trim().replace(/\s+/g, ' ');
      if (!name) return toast('Écris un pseudo');
      if (S.roster.players.some(p => p.name.toLowerCase() === name.toLowerCase())) return toast('Ce pseudo existe déjà');
      inp.value = ''; saveRoster({...S.roster, players: [...S.roster.players, {name, emoji: '🎮'}]}); toast(name + ' ajouté'); break;
    }
    case 'map-add': {
      const inp = $('#new-map'); const m = inp.value.trim();
      if (!m) return toast('Écris un nom de map');
      if (S.roster.maps.some(x => x.toLowerCase() === m.toLowerCase())) return toast('Cette map existe déjà');
      inp.value = ''; saveRoster({...S.roster, maps: [...S.roster.maps, m]}); break;
    }
    case 'snd-test': case 'snd-save': {
      if (!U.snd.file) return toast('Choisis d’abord un fichier audio');
      if (!ctx()) return toast('Ce navigateur ne gère pas l’audio');
      unlock(); U.snd.busy = true; render();
      prepareSound().then(p => {
        U.snd.busy = false; render();
        if (a === 'snd-test') return playBuffer(p.buffer);
        const doc = {name: U.snd.file.name.replace(/\.[^.]+$/, '').slice(0, 60), wav: p.wav, dur: p.dur, start: p.start, v: Date.now()};

/* ---------- Son & écran de victoire ---------- */
let actx = null, soundOn = true, soundDoc = null, victoryBuf = null, victoryKey = '', curSrc = null, vTimer;
const ctx = () => { if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) { actx = new C(); actx.onstatechange = () => renderSound(); } } return actx; };
function unlock() {
  const c = ctx(); if (!c) return;
  if (c.state === 'suspended') c.resume();
  const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
}
// Son toujours actif, impossible à couper. Les navigateurs exigent un premier geste pour jouer du son :
// on « débloque » l'audio à chaque toucher tant qu'il n'est pas actif (iOS : touchend/click).
['pointerdown', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, () => { if (!actx || actx.state !== 'running') unlock(); renderSound(); }, {passive: true}));
function renderSound() {
  const b = $('#sound'), ready = actx && actx.state === 'running';
  b.className = 'sound on'; b.textContent = ready ? '🔊 Son activé' : '🔊 Touche l’écran pour le son';
}
$('#sound').addEventListener('click', () => { unlock(); setTimeout(renderSound, 150); });
const b64ToBuf = b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
const bufToB64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const decode = ab => new Promise((res, rej) => { const p = ctx().decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });

async function victoryBuffer() {
  if (!soundDoc || !soundDoc.wav) return null;
  const key = String(soundDoc.v || soundDoc.wav.length);
  if (victoryBuf && victoryKey === key) return victoryBuf;
  victoryBuf = await decode(b64ToBuf(soundDoc.wav)); victoryKey = key;
  return victoryBuf;
}
function playBuffer(buf) {
  const c = ctx(); stopVictory();
  const s = c.createBufferSource(); s.buffer = buf; s.connect(c.destination); s.start(); curSrc = s;
}
/* Quelques secondes de la musique de victoire (fiche joueur) */
async function playSnippet(sec) {
  if (!soundOn || !ctx()) return;
  try { if (actx.state === 'suspended') await actx.resume(); } catch (e) {}
  try {
    const buf = await victoryBuffer();
    if (buf) {
      stopVictory();
      const t = actx.currentTime, d = Math.min(sec, buf.duration), s = actx.createBufferSource(), g = actx.createGain();
      g.gain.setValueAtTime(1, t); g.gain.setValueAtTime(1, t + Math.max(0, d - 0.6)); g.gain.linearRampToValueAtTime(0, t + d);
      s.buffer = buf; s.connect(g); g.connect(actx.destination); s.start(t, 0, d); curSrc = s;
      return;
    }
  } catch (e) {}
  fanfare();
}
function fanfare() {
  const c = ctx(), t = c.currentTime;
  [[523, 0, .14], [523, .15, .14], [523, .3, .14], [659, .45, .45], [523, .95, .18], [659, 1.15, .18], [784, 1.35, .9]].forEach(([f, s, d]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + s); g.gain.exponentialRampToValueAtTime(0.15, t + s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + s + d);
    o.connect(g); g.connect(c.destination); o.start(t + s); o.stop(t + s + d + 0.05);
  });
}
async function playVictory() {
  if (!soundOn || !ctx()) return;
  try { if (actx.state === 'suspended') await actx.resume(); } catch (e) {}
  try { const buf = await victoryBuffer(); if (buf) return playBuffer(buf); } catch (e) {}
  fanfare();
}
function stopVictory() { try { curSrc && curSrc.stop(); } catch (e) {} curSrc = null; }
function celebrate(r) {
  const v = $('#victory');
  const names = r.players.filter(p => p.team === r.winner).map(p => label(p.name)).join(' · ');
  v.style.setProperty('--vc', r.winner === 1 ? 'var(--t1)' : 'var(--t2)');
  v.style.setProperty('--vc-soft', r.winner === 1 ? 'rgba(78,161,255,.35)' : 'rgba(255,106,77,.35)');
  const stk = r.players.filter(p => p.team === r.winner && stickers[p.name]).map(p => `<img src="${stickers[p.name]}" alt="${esc(p.name)}">`).join('');
  v.innerHTML = `<div><div class="vs">Game ${esc(r.n)} · ${esc(r.map)}</div><div class="vt">Victoire</div><div class="vs">Équipe ${r.winner}</div>${stk ? `<div class="vstk">${stk}</div>` : ''}${names ? `<div class="vn">${names}</div>` : ''}<div class="vh">Touche pour fermer</div></div>`;
  v.hidden = false; playVictory();
  clearTimeout(vTimer); vTimer = setTimeout(closeVictory, 20000);
}
function closeVictory() { $('#victory').hidden = true; stopVictory(); clearTimeout(vTimer); }
$('#victory').addEventListener('click', closeVictory);
$('#pop').addEventListener('click', e => { if (e.target.id === 'pop') closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#pop').hidden) closePop(); });

/* Découpe un extrait du fichier choisi, le convertit en WAV mono léger pour le partager via la base */
const SND_RATE = () => mode === 'firebase' ? 22050 : 11025;
const SND_MAX = () => Math.floor((mode === 'firebase' ? 780000 : 230000) * 0.75 / (SND_RATE() * 2));
function toWav(buf) {
  const d = buf.getChannelData(0), n = d.length, rate = buf.sampleRate;
  const ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(d[i]));
  const k = peak > 0 ? Math.min(0.95 / peak, 4) : 1;
  for (let i = 0; i < n; i++) { const x = Math.max(-1, Math.min(1, d[i] * k)); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return ab;
}
async function prepareSound() {
  const f = U.snd.file; if (!f) throw new Error('Choisis d’abord un fichier audio');
  const src = await decode(await f.arrayBuffer());
  const start = Math.max(0, Math.min(U.snd.start, Math.max(0, src.duration - 1)));
  const dur = Math.max(1, Math.min(U.snd.dur, SND_MAX(), src.duration - start));
  const rate = SND_RATE(), OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const off = new OC(1, Math.floor(dur * rate), rate);
  const s = off.createBufferSource(), g = off.createGain();
  s.buffer = src; g.gain.setValueAtTime(1, 0); g.gain.setValueAtTime(1, Math.max(0, dur - 0.8)); g.gain.linearRampToValueAtTime(0, dur);
  s.connect(g); g.connect(off.destination); s.start(0, start, dur);
  const out = await new Promise((res, rej) => { off.oncomplete = e => res(e.renderedBuffer); const p = off.startRendering(); if (p && p.then) p.then(res, rej); });
  return {buffer: out, wav: bufToB64(toWav(out)), dur, start};
}

/* ---------- Mise à jour de l'appli (utile sur l'écran d'accueil iPhone, sans bouton Actualiser) ---------- */
const APP_VERSION = '20261028-225008';
async function checkUpdate() {
  if (APP_VERSION === 'dev' || !/^https?:/.test(location.protocol)) return;
  try {
    const html = await (await fetch('./?v=' + Date.now(), {cache: 'no-store'})).text();
    const m = html.match(/APP_VERSION\s*=\s*'(\d{8}-\d{6})'/);
    if (m && m[1] !== APP_VERSION) $('#update').hidden = false;
  } catch (e) {}
}
$('#update').addEventListener('click', () => { location.replace(location.pathname + '?v=' + Date.now() + location.hash); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
setInterval(checkUpdate, 3 * 60000);
setTimeout(checkUpdate, 4000);

/* ---------- Démarrage ---------- */
let seenRounds = null;
function subscribe() {
  const onErr = err => { if (err && err.code !== 'revoked') toast(err.code === 'permission-denied' ? 'Accès à la base refusé : préviens Medos' : 'Synchro interrompue, recharge la page'); };
  store.doc('config/roster').onSnapshot(s => {
    if (s.exists) { const d = s.data(); S.roster = {players: (d.players || []).map(p => ({name: p.name, emoji: p.emoji || '🎮', aliases: Array.isArray(p.aliases) ? p.aliases.map(String).slice(0, 10) : []})), maps: [...(d.maps || [])]}; }
    render();
  }, onErr);
  store.doc('live/current').onSnapshot(s => {
    if (s.exists) { const d = s.data(); S.current = {map: d.map || S.roster.maps[0], winner: d.winner || 0, lineup: (d.lineup || []).map(l => ({name: l.name, team: l.team === 2 ? 2 : 1}))}; }
    render();
  }, onErr);
  store.collection('live').onSnapshot(q => {
    const v = {};
    q.docs.forEach(doc => {
      if (!doc.id.startsWith('vote_')) return;
      const x = doc.data(); if (!x || !x.cat || !x.voter || !x.choice) return;
      (v[x.cat] || (v[x.cat] = {}))[x.voter] = x.choice;
    });
    S.votes = v; if (U.tab === 'votes') render();
  }, onErr);
  store.doc('live/draw').onSnapshot(s => { S.draw = s.exists ? {...s.data()} : null; render(); }, onErr);
  store.collection('liverows').onSnapshot(q => {
    const m = {}; q.docs.forEach(d => { const x = d.data(); if (x && x.name) m[x.name] = {...zero(x.name), ...x}; });
    S.liverows = m; render();
  }, onErr);
  store.collection('rounds').onSnapshot(q => {
    S.rounds = q.docs.map(d => { const x = d.data(); return {id: d.id, n: x.n || 0, map: x.map, winner: x.winner, createdAt: x.createdAt || 0, photoAt: x.photoAt || 0, phash: x.phash || '', bots: x.bots || {}, score: x.score && x.score[1] != null && x.score[2] != null ? {1: +x.score[1], 2: +x.score[2]} : null, source: x.source || '', players: (x.players || []).map(p => ({...zero(p.name), ...p}))}; })
      .sort((a, b) => a.createdAt - b.createdAt);
    if (seenRounds) {
      const fresh = S.rounds.filter(r => !seenRounds.has(r.id) && Math.abs(Date.now() - r.createdAt) < 600000);
      if (fresh.length) celebrate(fresh[fresh.length - 1]);
    }
    seenRounds = new Set(S.rounds.map(r => r.id));
    S.loaded.rounds = true; render();
  }, onErr);
  store.collection('config').onSnapshot(q => {
    const seen = new Set();
    q.docs.forEach(doc => {
      if (!doc.id.startsWith('sticker_')) return;
      const x = doc.data(); if (!x || !x.name || !x.img) return;
      seen.add(x.name);
      const key = String(x.v || x.img.length);
      if (stickerKey[x.name] === key) return;
      if (stickers[x.name]) URL.revokeObjectURL(stickers[x.name]);
      try { stickers[x.name] = dataUrlToBlobUrl(x.img); stickerKey[x.name] = key; } catch (e) {}
    });
    Object.keys(stickers).forEach(n => { if (!seen.has(n) && stickerKey[n] !== 'local') { URL.revokeObjectURL(stickers[n]); delete stickers[n]; delete stickerKey[n]; } });
    render();
  }, onErr);
  store.doc('config/admin').onSnapshot(s => { adminHash = s.exists ? (s.data().hash || null) : null; adminLoaded = true; render(); }, onErr);
  store.doc('config/sound').onSnapshot(s => { soundDoc = s.exists ? s.data() : null; if (U.tab === 'reglages') render(); }, onErr);
}

(async () => {
  renderSound(); render();
  if (window.FIREBASE_CONFIG && window.firebase) {
    try { firebase.initializeApp(window.FIREBASE_CONFIG); store = firebase.firestore(); mode = 'firebase'; subscribe(); render(); return; }
    catch (e) { store = null; }
  }
  let db = null, user = null;
  for (let i = 0; i < 10 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
  if (window.claude && window.claude.use) {
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    try { user = await window.claude.use('user'); } catch (e) { user = null; }
  }
  if (db) {
    store = db; mode = 'live';
    try { const can = user && user.can ? await user.can('data.write') : null; if (can === false) readOnly = true; } catch (e) {}
  } else { store = localStore(); mode = 'local'; }
  subscribe(); render();
})();
